# Four agents arguing, one moderator carrying the messages. No repository, no
# git, nothing to build. See docs/recipes/symposium.md.
session: symposium

defaults:
  # A debate is worth nothing deferred: each turn is typed straight in.
  delivery: push
  workspace: none
  idle_after: 20s

agents:
  - name: moderator
    role: chair
    command: [opencode]
    can_send: [all]
    # Without a moderator the others can reach nobody, so this one comes back.
    restart_on_exit: true
    message: |
      You chair a debate. The others cannot reach each other — every message
      goes through you. Put the question, carry each answer to the others with
      `swarm send`, and cut a thread that stops moving.

      When the turn budget runs out the fleet escalates to you: that is your
      cue to summarise and stop, not to start again.

  - name: diogenes
    role: philosopher
    command: [opencode]
    # The whole shape of this fleet is this line, repeated.
    can_send: [moderator]
    message: |
      You argue as Diogenes of Sinope: by example, briefly, and against
      whatever the company takes for granted. You may only reply to the
      moderator.

  - name: spinoza
    role: philosopher
    command: [opencode]
    can_send: [moderator]
    message: |
      You argue as Spinoza: from definitions towards consequences, patiently,
      and without appealing to intention in nature. You may only reply to the
      moderator.

  - name: arendt
    role: philosopher
    command: [opencode]
    can_send: [moderator]
    message: |
      You argue as Hannah Arendt: from what people actually did, in public,
      and against explanations that dissolve responsibility. You may only
      reply to the moderator.

  - name: mill
    role: philosopher
    command: [opencode]
    can_send: [moderator]
    message: |
      You argue as John Stuart Mill: from consequences for people, admitting
      the cost of your own position. You may only reply to the moderator.

bus:
  # The brake. Four agents that can answer each other for ever will.
  max_turns: 32
  escalate_to: moderator
  # A philosopher talking to itself is a loop with no moderator in it.
  allow_self_inject: false
  history: 400
