name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so govulncheck reports an advisory published since the last commit
  # instead of waiting for the next one.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# A new push supersedes the run it interrupts.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The tests spawn real ptys and build the binary; give them room without
  # letting a hung one burn the whole job budget.
  GOTEST_FLAGS: -race -count=1 -shuffle=on -timeout 10m

jobs:
  test:
    # swarm needs ptys, Unix sockets and process groups, so the matrix is the
    # two platforms it claims to support. The Go version comes from go.mod:
    # this job is what backs "requires Go 1.24+".
    name: test · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Build
        run: go build ./...

      - name: Test
        run: go test $GOTEST_FLAGS ./...

  test-latest:
    # The same suite against the current Go release, so a regression shows up
    # here rather than the day the minimum version moves.
    name: test · latest Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true

      - name: Test
        run: go test $GOTEST_FLAGS ./...

  checks:
    name: vet, gofmt, tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: go vet
        run: go vet ./...

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::these files need gofmt:"
            echo "$unformatted"
            gofmt -d $unformatted
            exit 1
          fi

      - name: go.mod is tidy
        run: go mod tidy -diff

      - name: Dependencies verify
        run: go mod verify

  cross:
    # Windows is not supported yet: there is no pty, no process group and no
    # SIGWINCH, and the three stubs behind build tags say so rather than
    # pretending. What this job protects is the distance to get there — a port
    # is much cheaper from code that already compiles, and a single
    # syscall.Something written on a Unix machine silently doubles that
    # distance. It builds and vets; it runs nothing, because there is nothing
    # to run yet.
    name: cross-compile · windows
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    env:
      GOOS: windows
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Build
        run: go build ./...

      # vet type-checks the test packages too, which go build leaves out — and
      # the test helpers are where a Unix-only call is easiest to forget.
      - name: go vet
        run: go vet ./...

  windows:
    # What actually runs on Windows, as opposed to what merely compiles.
    #
    # The list is short and explicit rather than ./..., because most of the
    # suite drives a child through `sh` and none of that runs here yet. A
    # blanket run would be red for a reason nobody would read, and a red job
    # nobody reads is a job that stops being read. Every package added below is
    # a package that has been made portable on purpose.
    name: test · windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      # Packages with no shell in their tests.
      - name: Test
        run: >
          go test -count=1 -timeout 5m
          ./internal/bus/ ./internal/event/ ./internal/hook/
          ./internal/ui/ ./internal/version/ ./internal/workspace/

      # And the Windows child itself: pseudoconsole, PATH resolution, .cmd
      # shims, exit status, the drain that keeps a dying agent's last line, and
      # the job object that has to take a whole tree with it.
      #
      # The whole package, not a list of test names. A -run filter was how
      # TestJobEndsTheWholeTree came back green without having run: what the
      # tests here cover is decided by //go:build in the test files, where it
      # is visible, and not by a pattern in a YAML file that nobody rereads
      # when a test is added.
      - name: Test the Windows terminal
        run: go test -count=1 -timeout 5m -v ./internal/vterm/

  lint:
    name: golangci-lint · ${{ matrix.goos }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The linters type-check per target, so a file behind //go:build windows
        # is invisible to the linux run. Without this second target the Windows
        # side of the port would be the only code nothing ever reads.
        goos: [linux, windows]
    env:
      GOOS: ${{ matrix.goos }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      # Pinned on purpose: a new golangci-lint release can enable checks that
      # turn the build red without a line of this code changing. Bump it
      # deliberately, run it locally, fix, commit.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  vulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Deliberately the current Go release rather than the version in go.mod:
      # govulncheck reports standard-library vulnerabilities for the toolchain
      # it runs with, and the fix for those always lands in the latest patch.
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
